<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="60%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="950" cy="315" r="400" fill="url(#glow)"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#cyanGrad)"/>

  <!-- Grid Reticles -->
  <line x1="80" y1="80" x2="1120" y2="80" stroke="#1e293b" stroke-width="1" stroke-dasharray="8 8"/>
  <line x1="80" y1="550" x2="1120" y2="550" stroke="#1e293b" stroke-width="1" stroke-dasharray="8 8"/>

  <!-- Left: Content Block -->
  <g transform="translate(100, 140)">
    <!-- Badges Row -->
    <rect x="0" y="0" width="180" height="34" rx="17" fill="rgba(0, 229, 255, 0.12)" stroke="#00e5ff" stroke-width="1.2"/>
    <text x="90" y="22" fill="#00e5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">NEURAL VISION 2.0</text>

    <rect x="195" y="0" width="180" height="34" rx="17" fill="rgba(59, 130, 246, 0.12)" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="285" y="22" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">ANDHRA PRADESH</text>

    <!-- Main Title -->
    <text x="0" y="115" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="-1">See &amp; Solve</text>

    <!-- Subtitle -->
    <text x="0" y="175" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600">AI Visual Problem Diagnostics &amp; Local Resolution</text>

    <!-- Description Paragraph -->
    <text x="0" y="235" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400">
      <tspan x="0" dy="0">Instant photo-to-solution intelligence for home, appliance, and civic issues.</tspan>
      <tspan x="0" dy="28">Safe step-by-step DIY walkthroughs, verified technicians, and municipal grievance drafts.</tspan>
    </text>

    <!-- Feature Pillars -->
    <g transform="translate(0, 310)">
      <circle cx="10" cy="10" r="5" fill="#00e5ff"/>
      <text x="26" y="15" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">Zero Sign-In Required</text>

      <circle cx="240" cy="10" r="5" fill="#00e5ff"/>
      <text x="256" y="15" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">Verified AP Directory</text>

      <circle cx="470" cy="10" r="5" fill="#00e5ff"/>
      <text x="486" y="15" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">MeeSeva &amp; MeekoSam Ready</text>
    </g>
  </g>

  <!-- Right: Quantum Aperture Graphic -->
  <g transform="translate(930, 315)">
    <circle cx="0" cy="0" r="160" fill="none" stroke="rgba(0, 229, 255, 0.2)" stroke-width="2" stroke-dasharray="16 12"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="#00e5ff" stroke-width="3" stroke-dasharray="240 40"/>
    <polygon points="0,-85 74,-42 74,42 0,85 -74,42 -74,-42" fill="rgba(0, 229, 255, 0.12)" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="24" fill="#00e5ff"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="6 6"/>
  </g>
</svg>
