  <circle cx="32" cy="32" r="24" fill="none" stroke="#1558C9" stroke-width="2.5" stroke-dasharray="120 25" opacity="0.95"/>
  <!-- Inner Neural Hexagon -->
  <polygon points="32,14 48,23 48,41 32,50 16,41 16,23" fill="rgba(21, 88, 201, 0.25)" stroke="#1558C9" stroke-width="2"/>
