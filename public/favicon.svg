<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <filter id="lime-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#D4FF24" flood-opacity="0.8"/>
    </filter>
    <pattern id="shield-mesh" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M 0 2 L 2 0 L 4 2 L 2 4 Z" fill="none" stroke="rgba(21, 88, 201, 0.4)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Base Dark Shield Plate -->
  <polygon points="24,4 42,8.5 41.5,23 34,34 24,44 14,34 6.5,23 6,8.5" fill="#080E1E"/>

  <!-- Hexagonal Nano-Mesh Texture -->
  <polygon points="24,4 42,8.5 41.5,23 34,34 24,44 14,34 6.5,23 6,8.5" fill="url(#shield-mesh)"/>

  <!-- Specular Glass Shine -->
  <polygon points="6,8.5 24,4 18,28 10,24" fill="rgba(255,255,255,0.08)"/>

  <!-- Inner Recessed Shield Plate -->
  <polygon points="24,8.5 38.5,12 38,22.5 31.5,32 24,39.5 16.5,32 10,22.5 9.5,12" fill="rgba(12,22,48,0.75)" stroke="#0A235F" stroke-width="1"/>

  <!-- Central Laser Dividing Seam -->
  <line x1="24" y1="6" x2="24" y2="41" stroke="rgba(59,130,246,0.45)" stroke-width="0.8"/>

  <!-- Left Wing Armor (Electric Cobalt) -->
  <path d="M 24,4 L 6,8.5 L 6.5,23 L 14,34 L 24,44" stroke="#1558C9" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M 24,4 L 6,8.5 L 6.5,23 L 14,34 L 24,44" stroke="rgba(255,255,255,0.45)" stroke-width="0.6" stroke-linejoin="round"/>

  <!-- Right Wing Kinetic Edge (Acid Lime) -->
  <path d="M 24,4 L 42,8.5 L 41.5,23 L 34,34 L 24,44" stroke="#D4FF24" stroke-width="2.4" stroke-linejoin="round" filter="url(#lime-glow)"/>

  <!-- Outer Range Reticle (Dashed) -->
  <circle cx="24" cy="23.5" r="9.5" fill="none" stroke="#1558C9" stroke-width="0.9" stroke-dasharray="3 1.5"/>

  <!-- Crosshairs -->
  <line x1="12" y1="23.5" x2="15.5" y2="23.5" stroke="#3B82F6" stroke-width="0.8"/>
  <line x1="32.5" y1="23.5" x2="36" y2="23.5" stroke="#D4FF24" stroke-width="0.8"/>
  <line x1="24" y1="11.5" x2="24" y2="15" stroke="#3B82F6" stroke-width="0.8"/>
  <line x1="24" y1="32" x2="24" y2="35.5" stroke="#3B82F6" stroke-width="0.8"/>

  <!-- Central Aperture Housing -->
  <circle cx="24" cy="23.5" r="7" fill="#040916" stroke="#1558C9" stroke-width="1.1"/>

  <!-- 6 Optical Shutter Blades -->
  <line x1="24" y1="16.5" x2="28" y2="21" stroke="#3B82F6" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="30.5" y1="21" x2="27.5" y2="26" stroke="#3B82F6" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="29" y1="28" x2="23.5" y2="28.5" stroke="#3B82F6" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="24" y1="30.5" x2="20" y2="26" stroke="#3B82F6" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="17.5" y1="26" x2="20.5" y2="21" stroke="#3B82F6" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="19" y1="19" x2="24.5" y2="18.5" stroke="#3B82F6" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Glowing Acid Lime Pupil -->
  <circle cx="24" cy="23.5" r="3.5" fill="#D4FF24"/>
  <circle cx="24" cy="23.5" r="1.3" fill="#FFFFFF"/>

  <!-- Horizontal Laser Scan Ray -->
  <line x1="16" y1="23.5" x2="32" y2="23.5" stroke="rgba(212,255,36,0.85)" stroke-width="0.75"/>
</svg>