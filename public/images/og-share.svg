<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030407"/>
      <stop offset="50%" stop-color="#060b17"/>
      <stop offset="100%" stop-color="#030407"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1558C9"/>
      <stop offset="50%" stop-color="#D4FF24"/>
      <stop offset="100%" stop-color="#1558C9"/>
    </linearGradient>
    <radialGradient id="cobaltRadial" cx="80%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1558C9" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#1558C9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#030407" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="limeSubtle" cx="20%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#D4FF24" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#030407" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base Midnight Black Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#limeSubtle)"/>
  <circle cx="950" cy="315" r="450" fill="url(#cobaltRadial)"/>

  <!-- Top Accent Laser Line -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#blueGlow)"/>

  <!-- Subtle Cyber Grid Coordinates -->
  <line x1="80" y1="80" x2="1120" y2="80" stroke="rgba(21, 88, 201, 0.25)" stroke-width="1" stroke-dasharray="8 8"/>
  <line x1="80" y1="550" x2="1120" y2="550" stroke="rgba(21, 88, 201, 0.25)" stroke-width="1" stroke-dasharray="8 8"/>

  <!-- Left Content Column -->
  <g transform="translate(100, 130)">
    <!-- Badges Row -->
    <rect x="0" y="0" width="220" height="34" rx="17" fill="rgba(212, 255, 36, 0.12)" stroke="#D4FF24" stroke-width="1.2"/>
    <text x="110" y="22" fill="#D4FF24" font-family="'Outfit', -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.5">NEURAL VISION 2.0</text>

    <rect x="236" y="0" width="180" height="34" rx="17" fill="#1558C9"/>
    <text x="326" y="22" fill="#FFFFFF" font-family="'Outfit', -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">ANDHRA PRADESH</text>

    <!-- Main Title -->
    <text x="0" y="118" fill="#FFFFFF" font-family="'Outfit', -apple-system, sans-serif" font-size="70" font-weight="800" letter-spacing="-1.5">See &amp; Solve</text>

    <!-- Subtitle in Acid Lime -->
    <text x="0" y="176" fill="#D4FF24" font-family="'Outfit', -apple-system, sans-serif" font-size="28" font-weight="700">Autonomous AI Visual Diagnostics &amp; Solutions</text>

    <!-- Description Paragraph in Inter -->
    <text x="0" y="234" fill="#CBD5E1" font-family="'Inter', -apple-system, sans-serif" font-size="20" font-weight="400">
      <tspan x="0" dy="0">Instant photo-to-solution intelligence for household, appliance, and civic issues.</tspan>
      <tspan x="0" dy="30">Safe step-by-step DIY walkthroughs, verified local technicians, and civic complaint drafts.</tspan>
    </text>

    <!-- Feature Pillars -->
    <g transform="translate(0, 315)">
      <rect x="0" y="0" width="185" height="44" rx="22" fill="#080d19" stroke="rgba(21, 88, 201, 0.45)" stroke-width="1.5"/>
      <text x="92" y="28" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle"><tspan fill="#D4FF24">✓ </tspan>AI Visual Scan</text>

      <rect x="200" y="0" width="200" height="44" rx="22" fill="#080d19" stroke="rgba(21, 88, 201, 0.45)" stroke-width="1.5"/>
      <text x="300" y="28" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle"><tspan fill="#D4FF24">✓ </tspan>Verified Techs</text>

      <rect x="415" y="0" width="225" height="44" rx="22" fill="#080d19" stroke="rgba(21, 88, 201, 0.45)" stroke-width="1.5"/>
      <text x="527" y="28" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle"><tspan fill="#D4FF24">✓ </tspan>MeeSeva Civic Node</text>
    </g>
  </g>

  <!-- Right: Cybernetic Civic Shield Pro Graphic in Electric Cobalt & Acid Lime -->
  <g transform="translate(940, 315)">
    <!-- Ambient Radial Aura -->
    <circle cx="0" cy="0" r="175" fill="#080e1e" stroke="rgba(21, 88, 201, 0.45)" stroke-width="2"/>
    <circle cx="0" cy="0" r="148" fill="none" stroke="rgba(212, 255, 36, 0.25)" stroke-width="1.5" stroke-dasharray="12 8"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="rgba(21, 88, 201, 0.35)" stroke-width="1"/>

    <!-- Scaled Cybernetic Civic Shield Pro -->
    <g transform="translate(-144, -144) scale(6)">
      <!-- Base Shield Plate -->
      <polygon points="24,4 42,8.5 41.5,23 34,34 24,44 14,34 6.5,23 6,8.5" fill="#060b18"/>
      <!-- Inner Bevel -->
      <polygon points="24,8.5 38.5,12 38,22.5 31.5,32 24,39.5 16.5,32 10,22.5 9.5,12" fill="rgba(12,22,48,0.85)" stroke="#0A235F" stroke-width="0.8"/>
      <!-- Central Seam -->
      <line x1="24" y1="6" x2="24" y2="41" stroke="rgba(59,130,246,0.5)" stroke-width="0.8"/>
      <!-- Left Wing Armor (Cobalt) -->
      <path d="M 24,4 L 6,8.5 L 6.5,23 L 14,34 L 24,44" stroke="#1558C9" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M 24,4 L 6,8.5 L 6.5,23 L 14,34 L 24,44" stroke="rgba(255,255,255,0.4)" stroke-width="0.6" stroke-linejoin="round"/>
      <!-- Right Wing Kinetic Edge (Acid Lime) -->
      <path d="M 24,4 L 42,8.5 L 41.5,23 L 34,34 L 24,44" stroke="#D4FF24" stroke-width="2.4" stroke-linejoin="round"/>
      <!-- Outer Range Reticle -->
      <circle cx="24" cy="23.5" r="9.5" fill="none" stroke="#1558C9" stroke-width="0.9" stroke-dasharray="3 1.5"/>
      <!-- Crosshairs -->
      <line x1="12" y1="23.5" x2="15.5" y2="23.5" stroke="#3B82F6" stroke-width="0.8"/>
      <line x1="32.5" y1="23.5" x2="36" y2="23.5" stroke="#D4FF24" stroke-width="0.8"/>
      <line x1="24" y1="11.5" x2="24" y2="15" stroke="#3B82F6" stroke-width="0.8"/>
      <line x1="24" y1="32" x2="24" y2="35.5" stroke="#3B82F6" stroke-width="0.8"/>
      <!-- Aperture Housing -->
      <circle cx="24" cy="23.5" r="7" fill="#040916" stroke="#1558C9" stroke-width="1.1"/>
      <!-- Shutter Blades -->
      <line x1="24" y1="16.5" x2="28" y2="21" stroke="#3B82F6" stroke-width="0.8" stroke-linecap="round"/>
      <line x1="30.5" y1="21" x2="27.5" y2="26" stroke="#3B82F6" stroke-width="0.8" stroke-linecap="round"/>
      <line x1="29" y1="28" x2="23.5" y2="28.5" stroke="#3B82F6" stroke-width="0.8" stroke-linecap="round"/>
      <line x1="24" y1="30.5" x2="20" y2="26" stroke="#3B82F6" stroke-width="0.8" stroke-linecap="round"/>
      <line x1="17.5" y1="26" x2="20.5" y2="21" stroke="#3B82F6" stroke-width="0.8" stroke-linecap="round"/>
      <line x1="19" y1="19" x2="24.5" y2="18.5" stroke="#3B82F6" stroke-width="0.8" stroke-linecap="round"/>
      <!-- Pupil -->
      <circle cx="24" cy="23.5" r="3.5" fill="#D4FF24"/>
      <circle cx="24" cy="23.5" r="1.3" fill="#FFFFFF"/>
      <!-- Laser Beam -->
      <line x1="16" y1="23.5" x2="32" y2="23.5" stroke="rgba(212,255,36,0.85)" stroke-width="0.75"/>
    </g>
  </g>

  <!-- Footer Watermark -->
  <text x="100" y="585" fill="#94A3B8" font-family="'Inter', -apple-system, sans-serif" font-size="14" letter-spacing="0.5">https://seeandsolve.in • Cyber-Precision AI Diagnostics Node</text>
</svg>
